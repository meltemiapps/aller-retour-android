name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      # The privacy promise is enforced here: the build fails if the APK can reach the network.
      - name: Check the APK has no internet permission
        run: |
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          "$AAPT" dump permissions "$APK" | tee permissions.txt
          if grep -qE "android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_BACKGROUND_LOCATION)" permissions.txt; then
            echo "::error::Forbidden permission found in APK"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: aller-retour-debug-apk
          path: app/build/outputs/apk/debug/*.apk
