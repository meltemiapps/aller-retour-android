name: Release

# Push a tag such as v1.0.0 to build a signed APK and attach it to a GitHub Release.
# Signing needs four repository secrets (see README > Releasing):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "POCKETBOOK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set. The release APK will be unsigned."
          fi

      - name: Build release APK
        env:
          POCKETBOOK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          POCKETBOOK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          POCKETBOOK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Check the APK has no internet permission
        run: |
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$AAPT" dump permissions "$APK" | tee permissions.txt
          ! grep -qE "android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_BACKGROUND_LOCATION)" permissions.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
